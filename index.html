<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Yandex.RTB -->
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>
    <style>
        .body {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #fff;
            padding: 10px 20px 10px 20px;
        }
        .block {
            padding: 0;
        }
        .block-label {
            display: block;
            width: 100%;
            margin-top: 16px;
            text-align: right;
        }
        .label {
            display: block;
            font-family: 'Roboto Slab', Arial, sans-serif;
            font-size: 17px;
            line-height: 24px;
            color: #999999;
        }
        .grid {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: stretch;
            align-content: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .grid-row {
            position: relative;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: stretch;
            align-content: flex-start;
            width: 100%;
            margin-top: 15px;
        }
        .grid-row:first-child {
            margin-top: 0;
        }
        .grid-item {
            position: relative;
            flex: 1 1 0px;
            margin-left: 10px;
        }
        .grid-item:first-child {
            margin-left: 0;
        }
        .unit-wrapper {
            position: relative;
            display: flex;
            box-sizing: border-box;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Open Sans', Arial, sans-serif;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 16px;
            background-color: #fff;
        }
        .unit {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            text-decoration: none;
            color: black;
            width: 100%;
            cursor: pointer;
        }
        .image {
            width: 100%;
            height: 225px;
            position: relative;
            display: block;
            overflow: hidden;
            flex-grow: 0;
            flex-shrink: 0;
        }
        .ya-unit-image {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .unit-image,
        .yrw-img-component {
            height: 100%;
            padding-bottom: 0 !important;
        }
        .title {
            font-family: 'Roboto', sans-serif, Arial;
            font-size: 16px;
            line-height: 117%;
            font-weight: 500;
            color: #1E1E1E;
        }
        .ya-image-gallery {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .meta {
            display: none;
            color: #757575;
            font-size: 12px;
            padding-left: 10px;
        }
    </style>
    <div class="block">
        <ya-units-grid rows="${grid_rows}" cols="${grid_columns}">
            <div class="unit">
                <ya-unit-category class="ya-unit-category_default" ad-only/>
                <div class="body">
                    <div class="image"><ya-unit-image /></div>
                    <div class="title">
                        <ya-clamp lines="3"><ya-unit-title /></ya-clamp>
                    </div>
                    <div class="meta">
                        <ya-unit-date class="date"/>
                        <ya-unit-domain class="domain"/>
                    </div>
                </div>
            </div>
            <ya-unit-kebab />
        </ya-units-grid>
        <ya-recommendation-label />
    </div>
    <!-- Yandex.RTB C-A-505429-173 -->
<div id="yandex_rtb_C-A-505429-173"></div>
<script>window.yaContextCb.push(()=>{
  Ya.Context.AdvManager.renderWidget({
    renderTo: 'yandex_rtb_C-A-505429-173',
    blockId: 'C-A-505429-173'
  })
})</script>
</body>
</html>
